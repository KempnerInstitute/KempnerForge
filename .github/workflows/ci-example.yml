name: CI (examples)

on:
  push:
    branches: [main]
    paths:
      - "examples/vlm/**"
  pull_request:
    branches: [main]
    paths:
      - "examples/vlm/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Per-example gate, so touching one example does not run another's tests. Each
  # new example adds one output + filter here and one job below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      vlm: ${{ steps.filter.outputs.vlm }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vlm:
              - "examples/vlm/**"

  vlm-tests:
    needs: changes
    if: needs.changes.outputs.vlm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group video
      # Example tests are outside the root `testpaths`, so each tier is named here
      # explicitly. Each needs its own pytest session: the VLM-eval unit conftest
      # injects a fake `lmms_eval` that would leak into a tier sharing the session.
      # The matching integration tier needs the real, undeclared lmms-eval; manual only.
      - run: uv run pytest examples/vlm/eval/tests/unit -v --timeout=60
