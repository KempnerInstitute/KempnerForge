name: CI (examples)

on:
  push:
    branches: [main]
    paths:
      - "examples/vlm/**"
      - "examples/image_understanding/**"
      - "kempnerforge/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-example.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/vlm/**"
      - "examples/image_understanding/**"
      - "kempnerforge/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-example.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Per-example gate, so touching one example does not run another's tests, while a
  # change to kempnerforge/, pyproject.toml, uv.lock or this workflow runs them all.
  # Each new example adds one output + filter here and one job below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      vlm: ${{ steps.filter.outputs.vlm }}
      image_understanding: ${{ steps.filter.outputs.image_understanding }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: &core
              - "kempnerforge/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci-example.yml"
            vlm:
              - *core
              - "examples/vlm/**"
            image_understanding:
              - *core
              - "examples/image_understanding/**"

  vlm-tests:
    needs: changes
    if: needs.changes.outputs.vlm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group video
      # Example tests are outside the root `testpaths`, so they are named here by path.
      # The eval integration tier needs the real, undeclared lmms-eval and must not
      # share a session with the unit tier's injected fake `lmms_eval`; manual only.
      - run: uv run pytest examples/vlm/tests --ignore=examples/vlm/tests/eval/integration -v --timeout=60

  image-understanding-tests:
    needs: changes
    if: needs.changes.outputs.image_understanding == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest examples/image_understanding/tests -v --timeout=60
