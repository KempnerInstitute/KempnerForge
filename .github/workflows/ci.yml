name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group video
      - run: uv run ruff check kempnerforge/ tests/ scripts/
      - run: uv run ruff format --check kempnerforge/ tests/ scripts/
      - run: uv run pyright kempnerforge/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group video
      - run: uv run pytest tests/unit/ -v --timeout=60 --cov --cov-branch --cov-report=xml
      # Example tests are outside the root `testpaths`, so each tier is named here
      # explicitly. Each needs its own pytest session: the VLM-eval unit conftest
      # injects a fake `lmms_eval` that would leak into a tier sharing the session.
      # The matching integration tier needs the real, undeclared lmms-eval; manual only.
      - run: uv run pytest examples/vlm/eval/tests/unit -v --timeout=60
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: KempnerInstitute/KempnerForge

  gpu-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/integration/ -v --timeout=120 -m "not slow"
