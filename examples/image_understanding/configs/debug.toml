# 1-GPU smoke preset for the image-understanding example: a tiny Qwen3-shaped
# backbone, the random vision encoder (no download) and the recipe's avgpool
# connector, in the stage-1 shape (backbone frozen, connector trains).
#
# max_seq_len = pooled visual tokens + max_text_len: 64 random patch tokens
# (8x8 grid) pooled 2x2 give 16, plus 256 text tokens.
#
# Usage:
#   uv run python examples/image_understanding/train.py \
#       examples/image_understanding/configs/debug.toml

[model]
dim = 256
n_layers = 2
n_heads = 4
n_kv_heads = 2
head_dim_override = 64
vocab_size = 151936
ffn_hidden_dim = 512
norm_type = "rmsnorm"
norm_eps = 1e-6
activation = "silu"
qk_norm = true
rope_theta = 1000000.0
tie_embeddings = true
max_seq_len = 272

[vision_encoder]
type = "random"
feature_dim = 384
num_tokens = 64

[adapter]
type = "avgpool"
pool_window = 2

[vlm]
arch = "joint_decoder"
max_text_len = 256
freeze = [{ module = "transformer", frozen = true }]

[data]
hf_dataset_name = "sayakpaul/coco-30-val-2014"
hf_dataset_split = "train"
hf_dataset_image_field = "image"
hf_dataset_text_field = "caption"
hf_image_size = 224
tokenizer_path = "Qwen/Qwen3-0.6B"
num_workers = 2
pin_memory = true

[train]
batch_size = 2
seq_len = 272
max_steps = 50
grad_accum_steps = 1
grad_clip_norm = 1.0
seed = 42
compile_model = false
activation_checkpointing = "none"

[optimizer]
name = "adamw"
lr = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]
fused = false

[scheduler]
name = "cosine"
warmup_steps = 5
min_lr_ratio = 0.1

[distributed]
dp_shard = -1

[checkpoint]
dir = "checkpoints/image_understanding_debug"
interval = 25
keep_last_n = 2

[metrics]
log_interval = 5
enable_wandb = false
enable_tensorboard = false
