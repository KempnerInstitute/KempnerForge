# Stage 2 of the image-understanding recipe: the stage-1 model with every
# module training (backbone, vision encoder and connector), on the
# instruction mixture, warm-started from a stage-1 checkpoint.
#
# Same geometry as stage 1 (one 512 px view, 256 visual + 256 text tokens).
# The recipe's tiling, document packing and chat-template rendering with the
# loss on the assistant turns only are not in core yet (core masks one prompt
# field per row via data.hf_dataset_prompt_field); see the README's roadmap.
#
# Target: 16 GPUs, global batch 512, 90k steps.
#
# Usage:
#   uv run torchrun --nproc_per_node=4 examples/image_understanding/train.py \
#       examples/image_understanding/configs/qwen3_0.6b_siglip2_stage2.toml \
#       --train.grad_accum_steps=8

[model]
dim = 1024
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim_override = 128
vocab_size = 151936
ffn_hidden_dim = 3072
norm_type = "rmsnorm"
norm_eps = 1e-6
activation = "silu"
qk_norm = true
rope_theta = 1000000.0
tie_embeddings = false
max_seq_len = 512

[vision_encoder]
type = "siglip2"
path = "google/siglip2-so400m-patch16-512"
mixed_precision = "bf16"

[adapter]
type = "avgpool"
pool_window = 2

[vlm]
arch = "joint_decoder"
max_text_len = 256
freeze = []

[data]
hf_dataset_name = "sayakpaul/coco-30-val-2014"
hf_dataset_split = "train"
hf_dataset_image_field = "image"
hf_dataset_text_field = "caption"
hf_image_size = 512
tokenizer_path = "Qwen/Qwen3-0.6B"
num_workers = 8
pin_memory = true

[train]
batch_size = 16
seq_len = 512
max_steps = 90000
grad_accum_steps = 2
grad_clip_norm = 1.0
seed = 1
compile_model = false
activation_checkpointing = "full"

[optimizer]
name = "adamw"
lr = 5e-5
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1e-8
fused = true

[scheduler]
name = "cosine"
warmup_steps = 6000
min_lr_ratio = 0.1

[distributed]
dp_shard = -1

[checkpoint]
dir = "path-to-output-dir"
load_path = "path-to-stage1-checkpoint"
exclude_from_loading = ["optimizer", "train_state"]
interval = 5000
keep_last_n = 2
async_mode = "async"

[metrics]
log_interval = 20
enable_wandb = false
enable_tensorboard = true
tensorboard_dir = "path-to-tensorboard-dir"
