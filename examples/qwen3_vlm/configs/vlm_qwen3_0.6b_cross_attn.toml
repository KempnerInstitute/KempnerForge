# Video finetune: Qwen3-0.6B Cross-Attention VLM on WebVid-10M.
#
# Trains from scratch for now: a faithful warm-start needs a converted CA
# checkpoint, which requires a KF cross-attention arch-alignment first (the
# multimodal repo fuses K/V from the vision dim + shares the decoder FFN, vs
# KF's separate K/V from the text dim + a per-block FFN). Once that lands, set
# [checkpoint].load_path to the converted CA DCP.
#
# Image features flow as K/V into CrossAttentionBlocks (cadence 4 -> 7 blocks);
# the residual stream is text-only, so max_seq_len only needs to cover the text.
[model]
dim = 1024
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
vocab_size = 151936
ffn_hidden_dim = 3072
norm_type = "rmsnorm"
norm_eps = 1e-6
activation = "silu"
qk_norm = true
rope_theta = 1000000.0
tie_embeddings = false
max_seq_len = 512

[vision_encoder]
type = "siglip2"
path = "google/siglip2-so400m-patch14-224"

[adapter]
type = "mlp_2layer"
pre_norm = "rmsnorm"
hidden_dim = 1152
activation = "gelu"

[vlm]
arch = "cross_attention"
max_text_len = 64
cross_attention_every_n_layers = 4
freeze = [{ module = "vision_encoder", frozen = true }]

[video]
data_root = "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/video/webvid-10m"
dataset_type = "webvid"
split = "train"
max_frames = 4
min_frames = 2
fps = 2.0
frame_size = 224
max_samples = 4096

[data]
tokenizer_path = "Qwen/Qwen3-0.6B"
num_workers = 4
pin_memory = true

[train]
batch_size = 4
seq_len = 512
max_steps = 5000
grad_accum_steps = 1
grad_clip_norm = 1.0
seed = 42
compile_model = false
activation_checkpointing = "none"

[optimizer]
name = "adamw"
lr = 2e-5
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1e-8
fused = true

[scheduler]
name = "cosine"
warmup_steps = 100
min_lr_ratio = 0.1

[checkpoint]
dir = "/n/netscratch/kempner_dev/amazloumi/video-arch/checkpoints/smoke/cross_video"
# load_path = "<converted CA DCP>"   # pending the CA arch-alignment
exclude_from_loading = ["optimizer", "dataloader"]
interval = 1000
keep_last_n = 1

[metrics]
log_interval = 10
enable_wandb = true
wandb_project = "kf-vlm-qwen3-video"
wandb_run_name = "qwen3-0.6b-cross-video"
enable_tensorboard = false
