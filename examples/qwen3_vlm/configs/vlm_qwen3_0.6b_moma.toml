# Video finetune: Qwen3-0.6B MoMa VLM on WebVid-10M.
#
# Trains from scratch: MoMa has no multimodal-repo counterpart, so there is no
# stage-1 checkpoint to warm-start from. Shared Q/K/V/O attention + per-modality
# MoE FFN groups; image tokens prepend the text sequence (same residual layout
# as JD/MoT). MoMa v1 is training-only (expert-choice routing is non-causal).
[model]
dim = 1024
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
vocab_size = 151936
ffn_hidden_dim = 3072
norm_type = "rmsnorm"
norm_eps = 1e-6
activation = "silu"
qk_norm = true
rope_theta = 1000000.0
tie_embeddings = false
max_seq_len = 1280

[vision_encoder]
type = "siglip2"
path = "google/siglip2-so400m-patch14-224"

[adapter]
type = "mlp_2layer"
pre_norm = "rmsnorm"
hidden_dim = 1152
activation = "gelu"

[vlm]
arch = "moma"
max_text_len = 64
moma_gumbel_noise = true
freeze = [{ module = "vision_encoder", frozen = true }]

[vlm.moma_experts_per_modality]
image = 2
text = 2

[video]
data_root = "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/video/webvid-10m"
dataset_type = "webvid"
split = "train"
max_frames = 4
min_frames = 2
fps = 2.0
frame_size = 224
max_samples = 4096

[data]
tokenizer_path = "Qwen/Qwen3-0.6B"
num_workers = 4
pin_memory = true

[train]
batch_size = 4
seq_len = 1280
max_steps = 5000
grad_accum_steps = 1
grad_clip_norm = 1.0
seed = 42
compile_model = false
activation_checkpointing = "none"

[optimizer]
name = "adamw"
lr = 2e-5
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1e-8
fused = true

[scheduler]
name = "cosine"
warmup_steps = 100
min_lr_ratio = 0.1

[distributed]
dp_shard = -1
nccl_timeout_sec = 600

[checkpoint]
dir = "/n/netscratch/kempner_dev/amazloumi/video-arch/checkpoints/smoke/moma_video"
interval = 1000
keep_last_n = 1

[metrics]
log_interval = 10
enable_wandb = true
wandb_project = "kf-vlm-qwen3-video"
wandb_run_name = "qwen3-0.6b-moma-video"
enable_tensorboard = false
