# Stage 1 contract of the two-stage image-understanding recipe.
#
# Qwen3-0.6B (frozen) + SigLIP2 p16-512 + pooled connector, whole-document
# packed captioning. The [vlm] table is the typed recipe contract (see
# examples/vlm/recipe.py); the manifest it references pins the source data
# and provenance. production_launch stays false until every OPEN provenance
# field is resolved; flipping it to true refuses to validate before then.
#
# The per-group optimizer values in [vlm.stage.optim_*] are the recipe
# authority; the single [optimizer]/[scheduler] sections below mirror the
# mixer group until per-group wiring lands, and the stage contract's
# grad_clip_norm = 0.0 (no clipping) is authoritative over [train].

plugins = ["recipe"]

[model]
dim = 1024
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim_override = 128
vocab_size = 151936
ffn_hidden_dim = 3072
norm_type = "rmsnorm"
norm_eps = 1e-6
activation = "silu"
qk_norm = true
rope_theta = 1000000.0
tie_embeddings = false  # untied at runtime; the published LM's tie is metadata (see [vlm])
max_seq_len = 12288

# Dims are probed at build time (feature_dim 1152, num_tokens 1024 for p16-512);
# the pinned geometry lives in [vlm.stage.geometry].
[vision_encoder]
type = "siglip2"
path = "google/siglip2-so400m-patch16-512"

[adapter]
type = "avgpool"
pool_window = 2
hidden_dim = 1152

[vlm]
arch = "image_understanding"
max_text_len = 256
freeze = [{ module = "transformer", frozen = true }]
lm_backbone_id = "Qwen/Qwen3-0.6B"
tokenizer_id = "Qwen/Qwen3-0.6B"
vision_tower_id = "google/siglip2-so400m-patch16-512"
connector_type = "avgpool"
connector_hidden_dim = 1152
use_chat_template = true
caption_prompt = "Provide a short caption for the image."
vision_border = false
nominal_text_context = 256
lm_tie_embeddings_metadata = true
lm_untie_at_runtime = true
loss_reduction = "sample_mean"
source_manifest = "image_understanding_manifest.json"
source_manifest_sha256 = "41f821828b0b3723f10de6c6bfba5f6557d026db3aca2f38c1276d07dc768a83"
production_launch = false

[vlm.stage]
stage = 1
max_steps = 50000
epochs = 1
seed = 1
accumulation_steps = 1
data_parallel_ranks = 16
train_lm = false
answer_only_loss = false
image_attention = "causal"
bidirectional_scope = ""
vision_tower_precision = "float32"
vision_attn_implementation = ""
resume_reset_data_order = false
grad_clip_norm = 0.0

[vlm.stage.geometry]
image_size = 512
patch_size = 16
pool_window = 2
tile_grid = 1
include_global_view = false
tokens_per_view = 256
pack_budget = 12288

[vlm.stage.optim_vision]
lr = 6e-6
warmup_steps = 5000
schedule_steps = 45000
min_lr = 6e-7
start_factor = 5e-4

[vlm.stage.optim_language]
lr = 2e-5
warmup_steps = 5000
schedule_steps = 45000
min_lr = 2e-6
start_factor = 5e-4

[vlm.stage.optim_mixer]
lr = 2e-4
warmup_steps = 5000
schedule_steps = 45000
min_lr = 2e-5
start_factor = 5e-4

[train]
batch_size = 1
seq_len = 12288
max_steps = 50000
grad_accum_steps = 1
seed = 1
compile_model = false
activation_checkpointing = "full"

[optimizer]
name = "adamw"
lr = 2e-4
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1e-8
fused = true

[scheduler]
name = "cosine"
warmup_steps = 5000
min_lr_ratio = 0.1

[data]
tokenizer_path = "Qwen/Qwen3-0.6B"
num_workers = 4
pin_memory = true

[distributed]
dp_shard = -1

[checkpoint]
dir = "checkpoints/image_understanding_stage1"
interval = 10000
keep_last_n = 2

[metrics]
log_interval = 10
enable_wandb = false
